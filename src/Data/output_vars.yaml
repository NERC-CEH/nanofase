soil:
  t:
    long_name: Timestep index
    description: Integer index of the timestep
    units: ~
  datetime:
    long_name: Date
    description: Datetime at the start of the current timestep
    units: ~
  x:
    long_name: Spatial x index
    description: x index of the current grid cell (longitudinal)
    units: ~
  y:
    long_name: Spatial y index
    description: y index of the current grid cell (latitudinal)
    units: ~
  easts:
    long_name: Eastings
    description: Eastings coordinate at the centre of the grid cell
    units: m
  norths:
    long_name: Northings
    description: Northings coordinate at the centre of the grid cell
    units: m
  p:
    long_name: Soil profile index
    description: Index of the soil profile within this grid cell
    comments: Currently limited to 1 soil profile per cell
    units: ~
  land_use:
    long_name: Main land use
    description: Predominant land use type of this soil profile
    units: ~
  m_contaminant_total:
    long_name: PFAS mass
    description: PFAS mass in whole soil profile, indexed by species, form and phase. Phase index follows P-FASE convention: 1=aqueous/porewater, 2=soil-solid sorbed, 3=SPM sorbed, 4=air-water interface, 5=foam/surface film, 6=air/aerosol.
    units: kg
  C_contaminant_total:
    long_name: PFAS concentration
    description: Average PFAS concentration across soil profile, indexed by species, form and phase. For soil, the main interpreted phases are aqueous porewater, soil-solid sorbed and air-water interface.
    units: kg/kg
  C_contaminant_l{i}:
    long_name: PFAS concentration in layer {i}
    description: PFAS concentration in soil layer {i}, indexed by species, form and phase. For soil layers, phase 1 is porewater, phase 2 is soil-solid sorbed, and phase 4 is air-water interface.
    units: kg/kg
    comments: Only output if include_soil_layer_breakdown = .true.
  m_contaminant_buried:
    long_name: PFAS exported below soil profile
    description: PFAS mass leaving the bottom of the represented soil profile on this timestep. In P-FASE this is a groundwater boundary export flux, not an internal groundwater compartment.
    units: kg
  j_contaminant_eroded:
    long_name: PFAS eroded from soil
    description: PFAS mass exported from the top soil layer with eroded solids on this timestep. This primarily represents solid-sorbed PFAS moved with eroded sediment.
    units: kg
  j_contaminant_leached:
    long_name: PFAS leached from soil
    description: Aqueous PFAS mass exported downward with percolating water on this timestep. This is reported as a bottom-boundary flux for external groundwater coupling.
    units: kg
  bulk_density:
    long_name: Bulk density
    description: Bulk density of this soil profile
    units: kg/m3
water:
  t:
    long_name: Timestep index
    description: Integer index of the timestep
    units: ~
  datetime:
    long_name: Date
    description: Datetime at the start of the current timestep
    units: ~
  x:
    long_name: Spatial x index
    description: x index of the current grid cell (longitudinal)
    units: ~
  y:
    long_name: Spatial y index
    description: y index of the current grid cell (latitudinal)
    units: ~
  easts:
    long_name: Eastings
    description: Eastings coordinate at the centre of the grid cell
    units: m
  norths:
    long_name: Northings
    description: Northings coordinate at the centre of the grid cell
    units: m
  w:
    long_name: Waterbody index
    description: Index of the waterbody within this grid cell
    comments: |
      Waterbodies can be river reaches or estuary reaches. Limited to 7 per cell.
      Only output if include_waterbody_breakdown is .true in config
    units: ~
  waterbody_type:
    long_name: Waterbody type
    description: Waterbody type - river or estuary?
    units: ~
  m_contaminant:
    long_name: PFAS mass
    description: PFAS mass in the waterbody, indexed by species, form and phase. Phase index follows P-FASE convention: 1=aqueous, 2=solid/bed-sediment sorbed, 3=SPM sorbed, 4=air-water interface, 5=foam/surface film, 6=air/aerosol.
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across waterbodies for this grid cell.
    units: kg
  C_contaminant:
    long_name: PFAS concentration
    description: PFAS concentration in the waterbody, indexed by species, form and phase. For water, the main interpreted phases are aqueous, SPM-sorbed, air-water interface, foam/surface film and air/aerosol export.
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the weighted average across waterbodies for this grid cell.
    units: kg/m3
  j_contaminant_outflow:
    long_name: PFAS mass in outflow
    description: PFAS mass in downstream outflow on this timestep. Aqueous PFAS follows water outflow; SPM-sorbed PFAS follows SPM outflow.
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the outflow to the grid cell.
    units: kg
  j_contaminant_deposited:
    long_name: PFAS mass deposited
    description: PFAS mass deposited to bed sediment on this timestep. In P-FASE this primarily represents SPM-sorbed PFAS transferred to bed-sediment solid-sorbed phase.
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  j_contaminant_resuspended:
    long_name: PFAS mass resuspended
    description: PFAS mass resuspended from bed sediment on this timestep. In P-FASE this primarily represents bed solid-sorbed PFAS transferred back to the water-column SPM-sorbed phase.
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  j_contaminant_foam:
    long_name: PFAS mass exported to foam
    description: PFAS mass transferred from the air-water interface to foam or surface film on this timestep.
    comments: |
      PFAS foam export is reported separately from normal water outflow.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  j_contaminant_atmosphere:
    long_name: PFAS mass exported to atmosphere
    description: PFAS mass exported to the atmospheric/aerosol phase by volatilisation, aerosolisation or sea-spray processes on this timestep.
    comments: |
      This is an export flux from the P-FASE surface-water compartment.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  j_contaminant_biota:
    long_name: PFAS mass transferred to biota
    description: PFAS mass transferred from the represented waterbody to aquatic biota on this timestep.
    comments: |
      This is a diagnostic uptake flux for represented biota.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  m_spm:
    long_name: Mass of suspended particulate matter
    description: Mass of suspended particulate matter
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  C_spm:
    long_name: Concentration of suspended particulate matter
    description: Concentration of suspended particulate matter
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the weighted average across the grid cell.
    units: kg/m3
  m_spm_erosion:
    long_name: Mass of suspended particulate matter from soil erosion
    description: Mass of suspended particulate matter from soil erosion on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  m_spm_dep:
    long_name: Mass of suspended particulate matter deposited
    description: Mass of suspended particulate matter deposited to bed sediment on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  m_spm_res:
    long_name: Mass of suspended particulate matter resuspended
    description: Mass of suspended particulate matter resuspended from bed sediment on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the grid cell.
    units: kg
  m_spm_inflow:
    long_name: Mass of suspended particulate matter in inflow
    description: Mass of suspended particulate matter in inflow from upstream on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the summed across the inflows to the whole grid cell.
    units: kg
  m_spm_outflow:
    long_name: Mass of suspended particulate matter in outflow
    description: Mass of suspended particulate matter in outflow from upstream on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the outflow to the whole grid cell.
    units: kg
  m_spm_bank_erosion:
    long_name: Mass of suspended particulate matter from bank erosion
    description: Mass of suspended particulate matter from bank erosion on this timestep
    comments: |
      Only output if include_sediment_fluxes = .true.
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the sum across the whole grid cell.
    units: kg
  volume:
    long_name: Volume of water
    description: Volume of water
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the total volume of water across the whole grid cell.
    units: m3
  depth:
    long_name: Depth of water
    description: Depth of water
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the average depth across the whole grid cell.
    units: m
  flow:
    long_name: Flow rate
    description: Flow rate of water at outflow
    comments: |
      If include_waterbody_breakdown = .true., this is for each waterbody.
      If .false., this is the flow rate at the outflow to the grid cell.
    units: m3/s
sediment:
  t:
    long_name: Timestep index
    description: Integer index of the timestep
    units: ~
  datetime:
    long_name: Date
    description: Datetime at the start of the current timestep
    units: ~
  x:
    long_name: Spatial x index
    description: x index of the current grid cell (longitudinal)
    units: ~
  y:
    long_name: Spatial y index
    description: y index of the current grid cell (latitudinal)
    units: ~
  easts:
    long_name: Eastings
    description: Eastings coordinate at the centre of the grid cell
    units: m
  norths:
    long_name: Northings
    description: Northings coordinate at the centre of the grid cell
    units: m
  w:
    long_name: Waterbody index
    description: Index of the waterbody this bed sediment is in
    comments: |
      Waterbodies can be river reaches or estuary reaches. Limited to 7 per cell.
      Only output if include_waterbody_breakdown is .true in config
    units: ~
  waterbody_type:
    long_name: Waterbody type
    description: Waterbody type for the waterbody this bed sediment is in - river or estuary?
    units: ~
  m_contaminant_total:
    long_name: PFAS mass
    description: Total PFAS mass across the sediment layers, indexed by species, form and phase. For bed sediment, the main interpreted phases are porewater aqueous PFAS and sediment-solid sorbed PFAS.
    units: kg
  C_contaminant_total:
    long_name: PFAS concentration
    description: Total PFAS concentration across the sediment layers, indexed by species, form and phase. Porewater aqueous PFAS should be interpreted on a water-volume basis; solid-sorbed PFAS should be interpreted on a sediment-mass basis.
    units: kg/m3 and kg/kg
    comments: Outputs concentrations in kg/kg and kg/m3
  C_contaminant_l{i}:
    long_name: PFAS concentration in sediment layer {i}
    description: PFAS concentration in sediment layer {i}, indexed by species, form and phase. Porewater aqueous PFAS is reported by porewater volume; solid-sorbed PFAS is reported by sediment mass.
    units: kg/m3 and kg/kg
    comments: Outputs concentrations in kg/kg and kg/m3
  m_contaminant_buried:
    long_name: PFAS mass buried
    description: Mass of PFAS buried from the bottom sediment layer on this timestep. This is a burial/export flux from the active bed-sediment domain.
    units: kg
  j_contaminant_deposited:
    long_name: PFAS mass deposited to sediment
    description: PFAS mass deposited from water column to bed sediment on this timestep, primarily SPM-sorbed PFAS converted to sediment solid-sorbed PFAS.
    units: kg
  j_contaminant_resuspended:
    long_name: PFAS mass resuspended from sediment
    description: PFAS mass resuspended from bed sediment to water column on this timestep, primarily sediment solid-sorbed PFAS converted to water-column SPM-sorbed PFAS.
    units: kg
  bed_area:
    long_name: Bed sediment area
    description: Surface area of the bed sediment at the sediment-water interface
    units: m2
  sediment_mass:
    long_name: Fine sediment mass
    description: Mass of fine sediment in the bed sediment
    units: kg
biota:
  t:
    long_name: Timestep index
    description: Integer index of the timestep
    units: ~
  datetime:
    long_name: Date
    description: Datetime at the start of the current timestep
    units: ~
  x:
    long_name: Spatial x index
    description: x index of the current grid cell
    units: ~
  y:
    long_name: Spatial y index
    description: y index of the current grid cell
    units: ~
  easts:
    long_name: Eastings
    description: Eastings coordinate at the centre of the grid cell
    units: m
  norths:
    long_name: Northings
    description: Northings coordinate at the centre of the grid cell
    units: m
  biota:
    long_name: Biota index
    description: Index of the represented biota group
    units: ~
  biota_name:
    long_name: Biota name
    description: Name of the represented biota group
    units: ~
  C_active:
    long_name: Active PFAS body burden
    description: Active PFAS concentration in represented biota, indexed by PFAS species.
    units: kg/kg dw
  C_stored:
    long_name: Stored PFAS body burden
    description: Stored PFAS concentration in represented biota, indexed by PFAS species.
    units: kg/kg dw
